function task(){return E.task(state,D,today)}
function stopAudio(){audioToken++;try{window.speechSynthesis?.cancel()}catch{};const el=document.querySelector('.audio-status');if(el)el.textContent='已停止'}
function nav(view){stopAudio();state.view=view;hide=false;save();render()}
function pct(a,b){return b?Math.round(a/b*100)+'%':'—'}
function voiceStatus(){if(!window.speechSynthesis)return '当前浏览器不支持语音朗读，请换用 Safari、Chrome 或 Edge。';const voices=speechSynthesis.getVoices();if(!voices.length)return '正在加载设备语音；首次播放可能需要联网。';const v=voices.find(v=>v.lang.replace('_','-')===state.settings.accent);return v?`当前发音：${esc(v.name)} · ${state.settings.accent==='en-GB'?'英式':'美式'}`:'设备未提供所选口音，将使用可用英语音色；可在系统设置安装英式/美式语音。'}
function audioStatus(s){const el=document.querySelector('.audio-status');if(el)el.textContent=s}
function speak(text,lang,token){return new Promise((resolve,reject)=>{if(token!==audioToken)return resolve(false);if(!window.speechSynthesis)return reject(Error('当前浏览器不支持语音朗读'));const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.replace('_','-')===lang)||voices.find(v=>v.lang.startsWith(lang.slice(0,2)));if(lang==='zh-CN'&&voices.length&&!voice)return reject(Error('设备缺少中文语音，学习版无法朗读释义；请安装中文语音。'));const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=state.settings.rate;if(voice)u.voice=voice;let settled=false;const finish=(ok,error)=>{if(settled)return;settled=true;clearTimeout(timer);error?reject(error):resolve(ok)};const timer=setTimeout(()=>finish(false,Error('语音未响应，请检查系统声音或重新点击播放。')),45000);u.onend=()=>finish(token===audioToken);u.onerror=e=>{if(token!==audioToken||e.error==='canceled'||e.error==='interrupted')finish(false);else finish(false,Error('播放失败：'+e.error+'。请检查设备语音与网络。'))};speechSynthesis.speak(u)})}
const pause=(seconds,token)=>new Promise(resolve=>setTimeout(()=>resolve(token===audioToken),seconds*1000));
async function playOne(id,repeats=state.settings.repeats){stopAudio();const token=audioToken;audioStatus('正在播放…');try{for(let i=0;i<repeats;i++){if(!await speak(byId[id].en,state.settings.accent,token))return;if(i+1<repeats&&!await pause(state.settings.gap,token))return}audioStatus('播放完成')}catch(e){toast(e.message);audioStatus(e.message)}}
async function playlist(mode){stopAudio();const token=audioToken,ids=[...task().ids];if(!ids.length)return toast('今天没有待学习词条');try{for(let i=0;i<ids.length;i++){audioStatus(`${mode==='learn'?'学习版':'听写版'} · 第 ${i+1} / ${ids.length} 题`);const w=byId[ids[i]];if(!await speak(w.en,state.settings.accent,token))return;if(!await pause(mode==='learn'?state.settings.gap:state.settings.inputTime,token))return;if(mode==='learn'){if(!await speak(w.zh||'释义待核实','zh-CN',token))return;if(!await speak(w.en,state.settings.accent,token))return;if(!await pause(state.settings.gap,token))return}}audioStatus('今日音频播放完成')}catch(e){toast(e.message);audioStatus(e.message)}}
function audioPanel(){return `<details><summary>今日音频与播放设置</summary><p class="hint">按今日任务顺序播放：先复习，再学新词。学习版：英文 → 回想 → 中文 → 英文；听写版只读英文。</p><div class="row"><button data-audio="learn">播放学习版</button><button data-audio="dictation">播放听写版</button><button data-action="stop">停止</button></div><p class="audio-status" role="status"></p><p class="hint">${voiceStatus()}</p><p class="tiny muted">使用浏览器实时朗读，尚未生成可下载的整段音频文件。手机锁屏或切到后台可能中断；请保持页面打开。语音可能由设备或浏览器在线服务提供。</p><button class="link" data-nav="settings">调整口音、语速与间隔</button></details>`}
function home(){const t=task(),first=Object.values(t.first),remaining=E.newPool(state,D).length,forecast=E.forecast(state,D,today),wrong=D.words.filter(w=>state.stats[w.id]?.errors&&E.status(state.stats[w.id])!=='熟练').length;const complete=t.done.filter(id=>t.ids.includes(id)).length;const learned=D.words.length-remaining;
 return `<div class="topline"><div><p class="eyebrow">${today.replaceAll('-',' / ')} · 每日听力练习</p><h1>今天，从听清一个词开始。</h1><p class="muted">先温习，再听写。把听到的声音写下来。</p></div><span class="pill">${D.meta.listCount} 个 List</span></div><section class="panel today"><div class="row spread"><h2>今日任务</h2><span class="pill">${t.newIds.length?esc(byId[t.newIds[0]].lists[0]):'复习优先'}</span></div><div class="metrics"><div class="metric"><strong>${t.newIds.length}</strong><span>新词</span></div><div class="metric"><strong>${t.review.length}</strong><span>复习词</span></div><div class="metric"><strong>${complete}<small> / ${t.ids.length}</small></strong><span>已完成听写</span></div><div class="metric"><strong>${pct(first.filter(Boolean).length,first.length)}</strong><span>今日首次听写正确率</span></div></div><progress max="${t.ids.length||1}" value="${complete}"></progress><p class="row spread"><small>预计还需 ${Math.ceil(Math.max(0,t.ids.length-complete)*.75)} 分钟</small><small>今日已浏览 ${t.seen.length} 词 · 浏览不等于掌握</small></p></section><section class="actions"><button class="entry primary" data-nav="study"><span>01</span><strong>开始今日学习</strong><small>${t.position?'从上次停下的位置继续':'先复习到期词，再学习新词'}</small></button><button class="entry" data-action="test"><span>02</span><strong>开始听写</strong><small>只听音频，独立拼写</small></button><button class="entry" data-action="wrong"><span>03</span><strong>复习错词</strong><small>${wrong} 词仍待巩固</small></button></section>${t.reduced||t.backlog?`<p class="warning">复习积压较多，今天已自动减少新词。另有 ${t.backlog} 个到期词顺延，进度不会重置；可在下方调整负担。</p>`:''}<div class="secondarygrid"><section class="panel"><h2>学习旅程</h2><div class="row spread"><strong>${learned} / ${D.words.length} 词已学习</strong><small>${pct(learned,D.words.length)}</small></div><progress max="${D.words.length}" value="${learned}"></progress><p>预计学完新词 <strong>${forecast||'请调整计划'}</strong></p><p class="hint">按当前计划、不漏学且无新增积压估算。复习减量可能顺延；学完新词不代表已经完全掌握。</p><button class="link" data-nav="settings">调整每日计划</button></section><section class="panel"><h2>今天的节奏</h2><p class="muted">当天任务已保存。刷新不会换词；漏学后继续原有进度。</p><details><summary>调整当天任务</summary><p class="hint">保留已学习、已作答和正在听写的词；其余词顺延，不删除学习记录。</p><div class="countline"><label for="todayNew">新词上限</label><input id="todayNew" type="number" min="0" max="1557" value="${t.newIds.length}"></div><div class="countline"><label for="todayReview">复习上限</label><input id="todayReview" type="number" min="0" max="1557" value="${t.review.length}"></div><button data-action="adjust">应用到今天</button></details>${audioPanel()}</section></div>`}
let directoryPart='all';
function studyTask(){
 if(!state.studyList)return task();
 const list=D.lists.find(l=>l.name===state.studyList);if(!list){state.studyList=null;return task()}
 state.listPositions ||= {};
 return state.listPositions[list.name] ||= {ids:[...list.ids],review:[],newIds:[...list.ids],position:0,seen:[],done:[]};
}
function selectList(name){if(!D.lists.some(l=>l.name===name))return;state.studyList=name;nav('study')}
function directory(){return `<div class="topline"><div><p class="eyebrow">36 个学习日 · 自由选学</p><h1>选择你的 P 和 List</h1><p class="muted">第 1 天 P1 List1，第 2 天 P1 List2，依次到第 36 天 P4 List14。</p></div></div><div class="row part-tabs" aria-label="按 Part 筛选">${['all','P1','P2','P3','P4'].map(p=>`<button data-part="${p}" class="${directoryPart===p?'primary':''}" aria-pressed="${directoryPart===p}">${p==='all'?'全部':p}</button>`).join('')}</div><p class="hint">每个 List 分别保存学习位置。可以随时自由跳转；学过的词与听写结果会共用同一份复习记录。点击下一词会自动朗读 5 遍。</p>${['P1','P2','P3','P4'].filter(p=>directoryPart==='all'||directoryPart===p).map(p=>`<section class="list-section"><h2>${p} <small>· ${D.lists.filter(l=>l.name.startsWith(p)).length} 个 List</small></h2><div class="list-grid">${D.lists.map((l,i)=>({l,i})).filter(({l})=>l.name.startsWith(p)).map(({l,i})=>{const done=l.ids.filter(id=>state.stats[id]?.learned).length;const position=state.listPositions?.[l.name]?.position||0;return `<a class="list-card" href="?part=${l.name[1]}&list=${l.name.split('List ')[1]}"><div class="row spread"><span class="eyebrow">第 ${i+1} 天</span><span class="tiny muted">${l.ids.length} 词</span></div><strong>${esc(l.name)}</strong><progress max="${l.ids.length}" value="${done}"></progress><div class="row spread"><small>已学习 ${done} / ${l.ids.length}</small><small>${position?'继续第 '+(position+1)+' 词':'进入学习 →'}</small></div></a>`}).join('')}</div></section>`).join('')}`}
function study(){const t=studyTask();if(!t.ids.length)return '<section class="panel empty"><h1>今天没有学习任务</h1><button data-nav="settings">调整计划</button></section>';t.position=Math.min(t.position,t.ids.length-1);const id=t.ids[t.position],w=byId[id];return `<section class="study"><div class="row spread"><button class="link" data-nav="directory">← 选择 P / List</button><small>${state.studyList?esc(state.studyList):t.review.includes(id)?'到期复习 / 补学':'新词学习'} · ${t.position+1} / ${t.ids.length}</small></div><progress max="${t.ids.length}" value="${t.position+1}"></progress><div class="panel"><span class="pill">${esc(state.studyList||w.lists[0])}</span><div class="word">${hide?'回想刚才听到的拼写':esc(w.en)}</div><p class="meaning">${esc(w.zh||'释义缺失，待核实')}</p>${w.notes.length?`<p class="warning">${esc(w.notes.join('；'))}</p>`:''}<button class="play" data-play="${id}">▶ 播放发音</button><p class="audio-status" role="status"></p><div class="row controls"><button data-action="hide">${hide?'显示答案':'隐藏英文，回想拼写'}</button><button data-action="seen" class="primary">${t.position===t.ids.length-1?'完成浏览':'下一个单词 · 自动读 5 遍'}</button></div><div class="row spread"><button data-action="prev" ${t.position===0?'disabled':''}>上一词</button><button data-action="test">开始听写</button></div>${!hide&&w.variants.length?`<p class="hint">接受的拼写变体：${w.variants.map(esc).join(' / ')}</p>`:''}<p class="hint">看过不等于掌握；请用听写验证。${voiceStatus()}</p></div>${audioPanel()}</section>`}
function diff(a,b){a=E.norm(a);b=E.norm(b);const dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)dp[i][0]=i;for(let j=0;j<=b.length;j++)dp[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=a.length,j=b.length,out=[];while(i||j){if(i&&j&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){out.push(a[i-1]===b[j-1]?esc(b[j-1]):`<del>${esc(a[i-1])}</del><ins>${esc(b[j-1])}</ins>`);i--;j--}else if(i&&dp[i][j]===dp[i-1][j]+1){out.push(`<del>${esc(a[--i])}</del>`)}else out.push(`<ins>${esc(b[--j])}</ins>`)}return out.reverse().join('')}
function testView(){const q=state.session;if(!q||q.completed)return `<section class="panel empty"><p class="eyebrow">本轮已完成</p><h1>今天又多听清了一些。</h1><p>答错的词仍安排在明天复习。照抄不计入独立答对。</p><button class="primary" data-nav="home">回到今日</button></section>`;const id=q.queue[q.index],w=byId[id];return `<section class="study"><div class="row spread"><button class="link" data-nav="home">← 暂存并返回</button><small>${q.round>1?'错词回炉 · 第 '+q.round+' 轮':'纯音频听写'} · ${q.index+1} / ${q.queue.length}</small></div><progress max="${q.queue.length}" value="${q.index}"></progress><div class="panel"><p class="eyebrow">听声音，写下答案</p><button class="play" data-action="replay">▶ 播放 / 重播</button><p class="audio-status" role="status"></p><p class="hint">Enter 提交 · Alt + R 重播</p>${q.revealed?`<div class="answerbox"><small>正确答案</small><div class="word">${esc(w.en)}</div><p>${esc(w.zh)}</p>${w.notes.length?`<p class="warning">${esc(w.notes.join('；'))}</p>`:''}<p>你的输入：${esc(q.lastInput)}</p><p>拼写差异：${diff(q.lastInput,w.en)}</p><small>红色删除，绿色补入。请正确输入一次巩固；照抄不计独立答对。</small></div>`:''}<form id="answerForm"><input class="answerinput" id="answer" name="answer" aria-label="输入听到的内容" placeholder="输入听到的内容" value="${esc(q.input)}" autocomplete="off" autocapitalize="none" spellcheck="false" autocorrect="off" enterkeyhint="go"><button class="primary" type="submit">${q.revealed?'确认巩固':'提交答案'}</button></form><div class="inline-status" role="status">${q.feedback==='again'?'再听一次':q.feedback==='answer'?'已安排明天复习，并会在本轮结束后再次听写。':''}</div><p class="hint">忽略大小写、首尾和重复空格。单复数、词形和漏字母严格判分。</p></div></section>`}
function settings(){const c=state.settings;return `<div class="topline"><div><p class="eyebrow">按照你的节奏</p><h1>计划、声音与备份</h1></div></div><form id="settingsForm"><section class="panel"><h2>每日学习计划</h2><div class="settingsgrid"><label>计划方式<select name="mode"><option value="lists" ${c.mode==='lists'?'selected':''}>按原表 List</option><option value="count" ${c.mode==='count'?'selected':''}>按每日新词数</option><option value="target" ${c.mode==='target'?'selected':''}>按目标完成日期</option></select></label><label>每天几个 List<input name="lists" type="number" min="1" max="36" value="${c.lists}" required></label><label>每天新词数（按词数模式）<input name="count" type="number" min="1" max="1557" value="${c.count}" required></label><label>目标完成日期<input name="target" type="date" value="${c.target}" min="${today}"></label><label>每日复习上限<input name="reviewLimit" type="number" min="1" max="1557" value="${c.reviewLimit}" required></label><label>复习日程（学后第几天，递增）<input name="intervals" value="${c.intervals.join(', ')}" required></label></div><p class="hint">默认第 1、3、7、14、30 天。答错次日复习并重新起算；同日重试不延长间隔。至少跨日独立答对 3 次才进入「熟练」，之后仍继续复习。</p><p class="hint">复习达到 40 词，新词减半；达到复习上限则暂停新词。上限外的到期词保留，次日继续安排。</p></section><section class="panel"><h2>发音与每日音频</h2><div class="settingsgrid"><label>发音<select name="accent"><option value="en-GB" ${c.accent==='en-GB'?'selected':''}>英式英语</option><option value="en-US" ${c.accent==='en-US'?'selected':''}>美式英语</option></select></label><label>语速（0.5–1.5）<input name="rate" type="number" step="0.05" min="0.5" max="1.5" value="${c.rate}" required></label><label>逐词重复次数<input name="repeats" type="number" min="1" max="5" value="${c.repeats}" required></label><label>回想 / 连播间隔（秒）<input name="gap" type="number" min="1" max="60" value="${c.gap}" required></label><label>听写版输入时间（秒）<input name="inputTime" type="number" min="1" max="120" value="${c.inputTime}" required></label></div><p class="hint">${voiceStatus()}</p><p class="hint">浏览器语音实时播放，不是已生成的可下载音频文件。本版不需要付费密钥。</p></section><button class="primary" type="submit">保存设置</button><span class="hint"> 计划从明日起使用；今天可在首页单独调整。</span></form><section class="panel"><h2>记录备份</h2><p>无需注册。学习记录只保存在当前浏览器，换设备或清理浏览器后不会自动同步。</p><p class="hint">导出包含逐词记录、设置、每天任务与当前听写位置。导入会替换当前记录，请先备份。</p><div class="row"><button data-action="export">导出学习记录</button><label>导入记录（JSON）<input id="importFile" type="file" accept=".json,application/json"></label></div>${storageError?'<button data-action="rawExport">导出无法读取的原始备份</button>':''}<p id="importStatus" role="status"></p></section><section class="panel"><h2>词表说明</h2><p>来自《2023牛学雅思听力必考词汇》：${D.meta.rawCount} 条 → ${D.meta.uniqueCount} 个去重词条，${D.meta.listCount} 个 List。重复 ${D.meta.duplicates} 条已合并，保留所有来源分类。</p><p>已记录 ${D.meta.correctionCount} 处修订；${D.meta.flaggedCount} 条待核实。完整短语不拆分。音标与例句多数为空，不自动补造。</p><button class="link" data-nav="records">查看词条、原文与修订</button></section>`}
function records(){let words=D.words.filter(w=>(!search||E.norm(w.en+' '+w.zh+' '+w.lists.join(' ')).includes(E.norm(search)))&&(filter==='all'||filter==='flagged'&&w.notes.length||E.status(state.stats[w.id])===filter));page=Math.min(page,Math.max(0,Math.ceil(words.length/30)-1));return `<div class="topline"><div><p class="eyebrow">${D.words.length} 个词条 · 保留短语</p><h1>词库与学习记录</h1></div></div><section class="panel"><div class="settingsgrid"><label>搜索英文、中文或 List<input id="search" value="${esc(search)}" placeholder="例如：dishwasher / 洗碗机"></label><label>筛选<select id="filter">${['all','新词','待巩固','熟练','flagged'].map(x=>`<option value="${x}" ${x===filter?'selected':''}>${({all:'全部词条',flagged:'释义 / 表达待核实'})[x]||x}</option>`).join('')}</select></label></div><p class="hint">${words.length} 个结果。听写次数为独立提交次数；首次答对率按每轮首次提交计算，照抄不计。</p><div class="tablewrap"><table><thead><tr><th>词条 / 释义</th><th>状态</th><th>记录</th><th>下次复习</th></tr></thead><tbody>${words.slice(page*30,page*30+30).map(w=>{const r=state.stats[w.id];return `<tr><td><strong>${esc(w.en)}</strong> <button class="link" data-play="${w.id}" aria-label="播放 ${esc(w.en)}">▶</button><br>${esc(w.zh)}${w.notes.length?'<p class="warning">'+esc(w.notes.join('；'))+'</p>':''}<details><summary>来源与变体</summary><p>${esc(w.lists.join(' / '))}</p>${w.variants.length?'<p>接受：'+w.variants.map(esc).join(' / ')+'</p>':''}${w.sources.map(s=>`<p>第 ${s.row} 行：${esc(s.word)} — ${esc(s.meaning)}</p>`).join('')}</details></td><td>${E.status(r)}</td><td>${r?`学习：${r.learned||'—'}<br>听写 ${r.attempts} 次 · 错误 ${r.errors} 次<br>首次正确 ${pct(r.firstCorrect,r.rounds)}<br>${esc(r.last)}`:'尚未学习'}</td><td>${r?.next||'—'}</td></tr>`}).join('')}</tbody></table></div><div class="row spread"><button data-action="pageprev" ${page===0?'disabled':''}>上一页</button><small>${page+1} / ${Math.max(1,Math.ceil(words.length/30))}</small><button data-action="pagenext" ${(page+1)*30>=words.length?'disabled':''}>下一页</button></div></section>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.view));app.innerHTML=({home,directory,study,test:testView,settings,records}[state.view]||home)();if(state.view==='test')document.querySelector('#answer')?.focus();}
function startTest(wrong=false){stopAudio();if(!wrong&&state.session&&!state.session.completed&&state.session.date===today){state.view='test';save();render();return}const ids=wrong?D.words.filter(w=>state.stats[w.id]?.errors&&E.status(state.stats[w.id])!=='熟练').map(w=>w.id):state.view==='study'?studyTask().ids:task().ids;if(!ids.length)return toast('没有需要听写的词条');if(state.session&&!state.session.completed&&wrong){toast('请先完成当前听写，错词会在本轮后自动回炉。');nav('test');return}E.start(state,ids,today,wrong?'wrong':state.studyList||'today');state.view='test';save();render()}
function adjust(){const t=task();const n=Number(document.querySelector('#todayNew').value),r=Number(document.querySelector('#todayReview').value);if(![n,r].every(x=>Number.isInteger(x)&&x>=0&&x<=1557))return toast('请输入 0–1557 的整数');const protectedIds=new Set([...t.seen,...t.done,...Object.keys(t.first),...(state.session&&!state.session.completed?state.session.queue:[])]);const due=D.words.filter(w=>state.stats[w.id]?.next&&state.stats[w.id].next<=today).map(w=>w.id);const keep=(old,pool,cap)=>{const mandatory=old.filter(id=>protectedIds.has(id));return [...new Set([...mandatory,...pool])].slice(0,Math.max(cap,mandatory.length))};t.review=keep(t.review,[...t.review,...due],r);t.newIds=keep(t.newIds,[...t.newIds,...E.newPool(state,D)],n).filter(id=>!t.review.includes(id));t.ids=[...new Set([...t.review,...t.newIds])];t.position=Math.min(t.position,Math.max(0,t.ids.length-1));t.backlog=due.filter(id=>!t.review.includes(id)).length;save();render();toast('今天的任务已保存；已开始的词条保留。')}
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!dayCheck())return;if(b.dataset.list)return selectList(b.dataset.list);if(b.dataset.part){directoryPart=b.dataset.part;render();return}if(b.dataset.nav){if(b.dataset.nav==='study')state.studyList=null;return nav(b.dataset.nav);}if(b.dataset.play)return playOne(b.dataset.play);if(b.dataset.audio)return playlist(b.dataset.audio);switch(b.dataset.action){case 'test':return startTest();case 'wrong':return startTest(true);case 'stop':return stopAudio();case 'replay':return playOne(state.session.queue[state.session.index]);case 'hide':hide=!hide;render();return;case 'seen':{const t=studyTask(),id=t.ids[t.position];E.learn(state,id,today);if(!t.seen.includes(id))t.seen.push(id);const daily=task();if(daily.ids.includes(id)&&!daily.seen.includes(id))daily.seen.push(id);hide=false;stopAudio();const hasNext=t.position<t.ids.length-1;if(hasNext)t.position++;else toast('浏览完成。现在可以开始听写，检验独立拼写。');save();render();if(hasNext)playOne(t.ids[t.position],5);return}case 'prev':stopAudio();studyTask().position=Math.max(0,studyTask().position-1);hide=false;save();render();return;case 'adjust':return adjust();case 'export':download(JSON.stringify(state,null,2),`听写日课-${today}.json`);return;case 'rawExport':return download(localStorage.getItem(KEY)||'{}','原始记录备份.json');case 'pageprev':page--;render();return;case 'pagenext':page++;render();return}});
document.addEventListener('submit',e=>{if(!['answerForm','settingsForm'].includes(e.target.id))return;e.preventDefault();if(!dayCheck())return;if(e.target.id==='answerForm'){const input=document.querySelector('#answer').value;stopAudio();const result=E.answer(state,D,input,today);if(result?.empty)return toast('请先输入听到的内容');if(result?.advance){E.advance(state,today);save();render();toast(result.copy?'已完成照抄，仍需独立复习':'答对了');}else{save();render();}return}if(e.target.id==='settingsForm'){const f=new FormData(e.target),c={...state.settings};for(const k of ['mode','target','accent'])c[k]=f.get(k);for(const k of ['lists','count','reviewLimit','rate','gap','inputTime','repeats'])c[k]=Number(f.get(k));c.intervals=f.get('intervals').split(/[,，\s]+/).filter(Boolean).map(Number);if(c.mode==='target'&&(!c.target||c.target<today))return toast('请选择今天或之后的目标日期');try{E.validate({...state,settings:c},D)}catch{return toast('设置无效；复习日程须为 1–365 的严格递增整数。')}state.settings=c;save();render();toast('设置已保存。今日任务保持稳定；可在首页调整。')}});
document.addEventListener('input',e=>{if(e.target.id==='answer'&&state.session){state.session.input=e.target.value;save()}if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;page=0;render();const el=document.querySelector('#search');el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id==='pickPart'){refreshPicker(Number(e.target.value));return;}if(e.target.id==='filter'){filter=e.target.value;page=0;render()}if(e.target.id==='importFile'){const file=e.target.files[0];if(!file)return;try{if(file.size>20e6)throw Error('文件过大，请选择本应用导出的 JSON 记录');const incoming=E.validate(JSON.parse(await file.text()),D);if(!confirm('导入将替换当前记录。确定已备份并继续？'))return;stopAudio();state=incoming;storageError=false;today=E.date();if(state.session?.date!==today)state.session=null;state.view='home';save();render();toast('导入成功，已恢复任务与进度')}catch(err){toast(err.message||'导入失败，现有数据未更改')}}});
document.addEventListener('keydown',e=>{if(e.altKey&&e.key.toLowerCase()==='r'&&state.view==='test'&&!state.session?.completed){e.preventDefault();playOne(state.session.queue[state.session.index])}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){stopAudio();try{state=E.validate(JSON.parse(e.newValue),D);render();toast('已载入另一个标签页保存的进度')}catch{toast('另一个标签页的数据无法读取')}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayCheck()});
if(state.session?.date!==today)state.session=null;if(state.view==='test'&&!state.session)state.view='home';task();save();render();
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'read_learning_progress',description:'读取今日学习任务与进度，不返回听写答案',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('不接受参数');const t=task();return {date:today,newWords:t.newIds.length,reviewWords:t.review.length,completed:t.done.length,total:D.words.length}}})}catch{}}

function refreshPicker(part,selected=1){const el=document.querySelector('#pickList');if(!el)return;const count=[0,13,4,5,14][part]||13;el.innerHTML=Array.from({length:count},(_,i)=>`<option value="${i+1}" ${i+1===selected?'selected':''}>List ${i+1}</option>`).join('')}
function applyRequestedList(query){const part=query.get('part'),list=query.get('list');if(query.get('view')==='directory'){nav('directory');return}if(part&&list){const name=`P${part} · List ${list}`;if(D.lists.some(l=>l.name===name)){selectList(name);return}toast('这个 P 下没有该 List，请重新选择。')}}
if(typeof location!=='undefined'){const query=new URLSearchParams(location.search);const match=state.studyList?.match(/^P(\d) · List (\d+)$/);const part=Number(query.get('part')||match?.[1]||1);const selected=Number(query.get('list')||match?.[2]||1);document.querySelector('#pickPart').value=String(part);refreshPicker(part,selected);applyRequestedList(query)}
</script></body></html>
